<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kontea</title>
<meta name="description" content="Inventario automático para negocios — parte del ecosistema Divende">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
<link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#C7620F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0C09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kontea">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    color-scheme: light dark;
    --bg:#EEEAE1; --card:#FAF8F4; --card-2:#F2EDE3; --ink:#1B1712; --ink-dim:#6B6156;
    --line:#DED6C6; --accent:#C7620F; --accent-ink:#FFFFFF;
    --total-bg:#3A2410; --total-ink:#F6E9D8; --total-accent:#F0A94D;
    --danger:#C0392B; --ok:#3E8E5A; --warn:#C7860F;
    --radius:18px; --radius-sm:12px;
    --font: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E0C09; --card:#171310; --card-2:#1E1712; --ink:#F3EEE6; --ink-dim:#A89A88;
      --line:#2C241C; --accent:#E8894A; --accent-ink:#1B1712;
      --total-bg:#3A2410; --total-ink:#F6E9D8; --total-accent:#F0A94D;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E0C09; --card:#171310; --card-2:#1E1712; --ink:#F3EEE6; --ink-dim:#A89A88;
    --line:#2C241C; --accent:#E8894A; --accent-ink:#1B1712;
    --total-bg:#3A2410; --total-ink:#F6E9D8; --total-accent:#F0A94D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    min-height:100vh; -webkit-tap-highlight-color:transparent;
  }
  button, input, select, textarea{ font-family:inherit; }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  /* ---------- Auth ---------- */
  .auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px 100px;gap:18px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand .mark{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;}
  .brand .name{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .brand .sub{font-size:12.5px;color:var(--ink-dim);margin-top:-2px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:12.5px;color:var(--ink-dim);font-weight:600;}
  .field input, .field select{
    background:var(--card-2);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:11px 12px;color:var(--ink);font-size:15px;outline:none;width:100%;
  }
  .field input:focus, .field select:focus{border-color:var(--accent);}
  .btn{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--radius-sm);
    padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;width:100%;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.55;}
  .btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn.small{width:auto;padding:8px 12px;font-size:13px;}
  .btn.ghost{background:transparent;color:var(--accent);border:none;padding:6px;width:auto;font-weight:700;}
  .btn.scan{background:var(--total-bg);color:var(--total-accent);display:flex;align-items:center;justify-content:center;gap:8px;}
  .link-row{text-align:center;font-size:13.5px;color:var(--ink-dim);}
  .link-row a{color:var(--accent);text-decoration:none;font-weight:700;cursor:pointer;}
  .error-box{background:rgba(192,57,43,0.12);color:var(--danger);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;}
  .hint{font-size:12px;color:var(--ink-dim);line-height:1.4;}

  /* ---------- Shell ---------- */
  header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:flex-start;}
  header.top .hello{font-size:13px;color:var(--ink-dim);}
  header.top .rname{font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  header.top .avatar{width:36px;height:36px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;}
  header.top .row-actions{display:flex;gap:8px;align-items:center;}
  main{flex:1;padding:14px 18px 110px;display:flex;flex-direction:column;gap:16px;}

  .total-card{background:var(--total-bg);color:var(--total-ink);border-radius:var(--radius);padding:20px;}
  .total-card .lbl{font-size:12.5px;opacity:0.8;font-weight:600;}
  .total-card .amt{font-size:32px;font-weight:800;margin-top:4px;letter-spacing:-0.02em;}
  .total-card .row{display:flex;gap:18px;margin-top:14px;}
  .total-card .stat b{font-size:17px;display:block;color:var(--total-accent);}
  .total-card .stat span{font-size:11.5px;opacity:0.75;}

  .section-title{font-size:13px;font-weight:800;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;margin:2px 0 -4px;
    display:flex;justify-content:space-between;align-items:center;}

  .item-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;
    display:flex;align-items:center;gap:12px;}
  .item-card .ico{width:38px;height:38px;border-radius:10px;background:var(--card-2);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .item-card .body{flex:1;min-width:0;}
  .item-card .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-card .meta{font-size:12px;color:var(--ink-dim);margin-top:1px;}
  .item-card .right{text-align:right;flex-shrink:0;}
  .item-card .stock{font-weight:800;font-size:15px;}
  .item-card .stock.low{color:var(--danger);}
  .item-card .unit{font-size:11px;color:var(--ink-dim);}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:3px;}
  .badge.low{background:rgba(192,57,43,0.14);color:var(--danger);}
  .badge.ok{background:rgba(62,142,90,0.14);color:var(--ok);}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-dim);font-size:13.5px;}

  .fab-row{display:flex;gap:10px;}
  .fab-row .btn{flex:1;}

  nav.tabbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;
    background:var(--card);border:1px solid var(--line);border-radius:20px;display:flex;padding:6px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);z-index:10;}
  nav.tabbar button{flex:1;background:none;border:none;padding:9px 4px;border-radius:14px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-dim);font-size:10.5px;font-weight:700;}
  nav.tabbar button.active{background:var(--accent);color:var(--accent-ink);}
  nav.tabbar button svg{width:19px;height:19px;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px 28px;
    max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:17px;font-weight:800;}
  .seg{display:flex;gap:6px;background:var(--card-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:12px;}
  .seg button{flex:1;background:none;border:none;padding:8px 4px;border-radius:8px;font-size:12.5px;font-weight:700;
    color:var(--ink-dim);cursor:pointer;}
  .seg button.active{background:var(--accent);color:var(--accent-ink);}
  .ingredient-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .ingredient-row select{flex:2;}
  .ingredient-row input{flex:1;}
  .ingredient-row .rm{background:none;border:none;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px;flex-shrink:0;}
  .item-row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;}
  .item-row.uncertain{border-color:var(--warn);background:color-mix(in srgb, var(--warn) 8%, var(--card));}
  .item-row .top-line{display:flex;gap:8px;margin-bottom:6px;}
  .item-row .top-line input:first-child{flex:2;}
  .item-row .bottom-line{display:flex;gap:8px;align-items:center;}
  .item-row input{background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font-size:13.5px;width:100%;}
  .item-row .uncertain-tag{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--warn);margin-bottom:6px;}
  .item-row .line-total-hint{font-size:11px;color:var(--ink-dim);margin-top:4px;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:10px 18px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,0.25);max-width:88%;text-align:center;}
  .toast.err{background:var(--danger);color:#fff;}
  .loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--ink-dim);font-size:13.5px;gap:8px;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .supplier-group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;}
  .supplier-group .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .supplier-group .head b{font-size:15px;}
  .order-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .order-row > span:first-child{flex:1;min-width:0;}
  .order-row .oq{flex-shrink:0;}
  .order-row:last-child{border-bottom:none;}
  .order-row .oq{font-weight:800;color:var(--accent);}
  .spend-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;}
  .spend-row b{font-weight:700;}
  .thumb{width:100%;border-radius:12px;margin-bottom:12px;max-height:160px;object-fit:cover;}

  /* ---------- Channel badges / filters / suppliers ---------- */
  .channel-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
  .channel-badge.whatsapp{background:rgba(37,211,102,0.16);color:#1F9C55;}
  .channel-badge.portal{background:rgba(62,123,250,0.14);color:#3E7BFA;}
  .channel-badge.presencial{background:rgba(199,134,15,0.16);color:var(--warn);}
  .channel-badge.telefono{background:rgba(139,111,78,0.16);color:#8B6F4E;}
  .filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .filter-chips button{flex-shrink:0;background:var(--card-2);border:1px solid var(--line);color:var(--ink-dim);
    font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;}
  .filter-chips button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .supplier-row{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;
    display:flex;align-items:center;gap:12px;}
  .supplier-row .ico{width:38px;height:38px;border-radius:10px;background:var(--card-2);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
  .supplier-row .body{flex:1;min-width:0;}
  .supplier-row .nm{font-weight:700;font-size:14.5px;}
  .supplier-row .meta{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .order-actions{display:flex;gap:8px;margin-top:10px;}
  .order-actions .btn{width:auto;flex:1;padding:10px 12px;font-size:13.5px;}

  /* ---------- Desktop / wide screens ---------- */
  @media (min-width:860px){
    #app{max-width:1180px;margin:0 auto 0 240px;min-height:100vh;}
    header.top{padding:28px 36px 10px;}
    main{padding:20px 36px 60px;}
    nav.tabbar{
      position:fixed;left:0;top:0;bottom:0;transform:none;width:224px;max-width:224px;height:100vh;
      border-radius:0;flex-direction:column;align-items:stretch;justify-content:flex-start;
      padding:26px 14px;gap:4px;box-shadow:none;border:none;border-right:1px solid var(--line);
    }
    nav.tabbar button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:13.5px;}
    nav.tabbar button svg{width:19px;height:19px;flex-shrink:0;}
    #product-list, #orders-list, #supplier-list, #recipe-list, #low-list{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start;
    }
    .modal-bg{align-items:center;}
    .modal{max-width:480px;border-radius:22px;max-height:84vh;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div>Cargando Kontea…</div></div>

<script>
const SUPABASE_URL = "https://chxjofburbhutchqegsv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoeGpvZmJ1cmJodXRjaHFlZ3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODg4MzMsImV4cCI6MjA5MDc2NDgzM30.rZBzs3huCnTDD9ZkAWb3QFunmJImPlBlMXGjoAO8ayc";

const app = document.getElementById('app');
let STATE = {
  session: null, me: null, tab: 'dashboard',

  authMode: 'login'
};

function fmt(n){ return Number(n||0).toLocaleString('es-CR',{maximumFractionDigits:2}); }
function money(n){ return '₡' + Number(n||0).toLocaleString('es-CR',{maximumFractionDigits:0}); }
function initials(name){ return (name||'K').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function toast(msg, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function applyTheme(){
  const saved = localStorage.getItem('kontea_theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
}
applyTheme();

/* ---------------- AUTH ---------------- */
async function init(){
  const { data } = await sb.auth.getSession();
  STATE.session = data.session;
  if(STATE.session){ await loadMe(); } else { renderAuth(); }
  sb.auth.onAuthStateChange((event, session) => {
    STATE.session = session;
    if(event === 'SIGNED_OUT'){ STATE = {...STATE, me:null, session:null, tab:'dashboard'}; renderAuth(); }
  });
}

async function loadMe(){
  const { data, error } = await sb.rpc('api_me');
  if(error || !data || !data.ok){ renderNeedsProfile(); return; }
  STATE.me = data;
  try{
    await loadAll();
    render();
  }catch(err){
    console.error('loadAll/render failed', err);
    app.innerHTML = `
      <div class="auth-wrap">
        <div class="card">
          <h3 style="margin-top:0;">Hubo un problema cargando Kontea</h3>
          <p class="hint">${(err && err.message) ? err.message.replace(/</g,'&lt;') : 'Error desconocido'}</p>
          <button class="btn" id="reload-btn">Reintentar</button>
        </div>
      </div>`;
    document.getElementById('reload-btn').onclick = () => location.reload();
  }
}

function renderAuth(){
  const isSignup = STATE.authMode === 'signup';
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="brand">
        <div class="mark">K</div>
        <div><div class="name">Kontea</div><div class="sub">Inventario automático · parte del ecosistema Divende</div></div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 14px;font-size:16px;">${isSignup ? 'Crear cuenta' : 'Iniciar sesión'}</h3>
        <div id="auth-error"></div>
        <form id="auth-form">
          ${isSignup ? `<div class="field"><label>Tu nombre</label><input name="name" required></div>` : ''}
          <div class="field"><label>Correo</label><input name="email" type="email" required autocomplete="email"></div>
          <div class="field"><label>Contraseña</label><input name="password" type="password" required minlength="6" autocomplete="${isSignup?'new-password':'current-password'}"></div>
          ${isSignup ? `
          <div class="field">
            <label>¿Ya tienes un código de equipo (de Ticksy u otra app Divende)?</label>
            <input name="invite" placeholder="Código de equipo (opcional)">
          </div>
          <div class="field">
            <label>O nombre de tu restaurante (si es tu primera app)</label>
            <input name="restaurant_name" placeholder="Ej. Café Kracovia">
          </div>
          <div class="hint">Si ya usas Ticksy, entra con el mismo correo y contraseña — no hace falta crear cuenta de nuevo.</div>
          ` : ''}
          <button class="btn" style="margin-top:6px;" type="submit">${isSignup ? 'Crear cuenta' : 'Entrar'}</button>
        </form>
      </div>
      <div class="link-row">
        ${isSignup ? 'Ya tengo cuenta — <a id="toggle-auth">iniciar sesión</a>' : '¿Primera vez? <a id="toggle-auth">crear cuenta</a>'}
      </div>
    </div>`;
  document.getElementById('toggle-auth').onclick = () => { STATE.authMode = isSignup ? 'login' : 'signup'; renderAuth(); };
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const errBox = document.getElementById('auth-error');
    errBox.innerHTML = '';
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Un momento…';
    try{
      if(isSignup){
        const meta = { name: f.get('name') };
        if(f.get('invite')) meta.invite = f.get('invite').trim();
        if(f.get('restaurant_name')) meta.restaurant_name = f.get('restaurant_name').trim();
        if(!meta.invite && !meta.restaurant_name){ throw new Error('Escribe un código de equipo o el nombre de tu restaurante.'); }
        const { error } = await sb.auth.signUp({ email: f.get('email'), password: f.get('password'), options: { data: meta } });
        if(error) throw error;
        toast('Cuenta creada. Iniciando sesión…');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
        if(error) throw error;
      }
      const { data } = await sb.auth.getSession();
      STATE.session = data.session;
      await loadMe();
    }catch(err){
      errBox.innerHTML = `<div class="error-box">${(err.message||'Error').replace(/^.*invite_invalido.*$/,'Código de equipo inválido.').replace(/^.*nombre_restaurante_requerido.*$/,'Escribe el nombre de tu restaurante.')}</div>`;
      btn.disabled = false; btn.textContent = isSignup ? 'Crear cuenta' : 'Entrar';
    }
  };
}

function renderNeedsProfile(){
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="card">
        <h3 style="margin-top:0;">Tu cuenta no está vinculada a un restaurante</h3>
        <p class="hint">Esta cuenta existe pero no tiene un restaurante asociado todavía. Cierra sesión e ingresa con una cuenta de Ticksy, o crea una cuenta nueva indicando el nombre del restaurante.</p>
        <button class="btn secondary" id="signout-btn">Cerrar sesión</button>
      </div>
    </div>`;
  document.getElementById('signout-btn').onclick = async () => { await sb.auth.signOut(); };
}

/* ---------------- DATA ---------------- */
async function loadAll(){
  const rid = STATE.me.restaurant_id;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const [{data:products}, {data:cats}, {data:recipes}, {data:moves}, {data:suppliers}, {data:invoices}] = await Promise.all([
    sb.from('products').select('*').eq('restaurant_id', rid).eq('is_active', true).order('name'),
    sb.from('invoice_categories').select('*').order('id'),
    sb.from('recipes').select('*, recipe_items(*, products(name, unit_of_measure))').eq('restaurant_id', rid).eq('is_active', true).order('name'),
    sb.from('inventory_movements').select('*, products(name, unit_of_measure)').order('created_at', {ascending:false}).limit(30),
    sb.from('suppliers').select('*').eq('restaurant_id', rid).order('name'),
    sb.from('invoices').select('*, suppliers(name)').eq('restaurant_id', rid).neq('status','ANULADA').gte('invoice_date', monthStart.toISOString().slice(0,10)).order('invoice_date', {ascending:false})
  ]);
  STATE.products = products || [];
  STATE.categories = cats || [];
  STATE.recipes = recipes || [];
  STATE.movements = moves || [];
  STATE.suppliers = suppliers || [];
  STATE.monthInvoices = invoices || [];
  try{ await refreshPendingInvoices(); }catch(err){ console.error('refreshPendingInvoices failed', err); STATE.pendingInvoices = []; }
}
/* Facturas ya registradas (típicamente desde Ticksy, solo foto) que aún no
   tienen insumos — candidatas a completar sin volver a escanear. Se limita
   a los últimos 14 días: más atrás, lo comprado ya se consumió y sumarlo
   ahora al stock actual daría un número falso. */
async function refreshPendingInvoices(){
  const rid = STATE.me.restaurant_id;
  const since = new Date(); since.setDate(since.getDate() - 14);
  const {data} = await sb.from('invoices')
    .select('*, suppliers(name)')
    .eq('restaurant_id', rid).neq('status','ANULADA')
    .not('supplier_id','is', null)
    .gte('invoice_date', since.toISOString().slice(0,10))
    .order('invoice_date', {ascending:false});
  const list = data || [];
  if(!list.length){ STATE.pendingInvoices = []; return; }
  const ids = list.map(i=>i.id);
  const [{data:withItems}, {data:dismissed}] = await Promise.all([
    sb.from('invoice_items').select('invoice_id').in('invoice_id', ids),
    sb.from('kontea_invoice_dismissals').select('invoice_id').in('invoice_id', ids)
  ]);
  const skip = new Set([...(withItems||[]).map(r=>r.invoice_id), ...(dismissed||[]).map(r=>r.invoice_id)]);
  STATE.pendingInvoices = list.filter(i => !skip.has(i.id));
}
async function refreshProducts(){
  const rid = STATE.me.restaurant_id;
  const {data} = await sb.from('products').select('*').eq('restaurant_id', rid).eq('is_active', true).order('name');
  STATE.products = data || [];
}

/* Arma un catálogo compacto de insumos conocidos (nombre por proveedor) para ayudar a la IA
   a reconocer letra manuscrita ambigua contra lo que este negocio ya compra habitualmente.
   Si supplierId se da, solo incluye los insumos de ese proveedor (más preciso); si no,
   incluye todo el catálogo activo agrupado por proveedor. Vacío al inicio (negocio nuevo) —
   no hace falta ningún paso extra del usuario, se construye solo con el uso normal. */
function buildKnownCatalog(supplierId){
  if(!STATE.products || !STATE.products.length) return '';
  const bySupplier = {};
  const supplierName = (id) => (STATE.suppliers.find(s=>s.id===id)||{}).name || 'Sin proveedor';
  STATE.products.forEach(p => {
    if(supplierId && p.preferred_supplier_id !== supplierId) return;
    const key = p.preferred_supplier_id || '__none';
    (bySupplier[key] = bySupplier[key] || []).push(p.name);
  });
  const lines = Object.keys(bySupplier).map(key => `- ${key==='__none' ? 'Sin proveedor asignado' : supplierName(key)}: ${bySupplier[key].join(', ')}`);
  return lines.join('\n');
}
async function refreshMovements(){
  const {data} = await sb.from('inventory_movements').select('*, products(name, unit_of_measure)').order('created_at',{ascending:false}).limit(30);
  STATE.movements = data || [];
}
async function refreshRecipes(){
  const rid = STATE.me.restaurant_id;
  const {data} = await sb.from('recipes').select('*, recipe_items(*, products(name, unit_of_measure))').eq('restaurant_id', rid).eq('is_active', true).order('name');
  STATE.recipes = data || [];
}
async function refreshSuppliers(){
  const rid = STATE.me.restaurant_id;
  const {data} = await sb.from('suppliers').select('*').eq('restaurant_id', rid).order('name');
  STATE.suppliers = data || [];
}
async function refreshMonthInvoices(){
  const rid = STATE.me.restaurant_id;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const {data} = await sb.from('invoices').select('*, suppliers(name)').eq('restaurant_id', rid).neq('status','ANULADA').gte('invoice_date', monthStart.toISOString().slice(0,10)).order('invoice_date',{ascending:false});
  STATE.monthInvoices = data || [];
}

/* ---------------- SHELL / RENDER ---------------- */
function catOf(id){ return STATE.categories.find(c=>c.id===id); }
function supOf(id){ return STATE.suppliers.find(s=>s.id===id); }
function lowStockList(){ return STATE.products.filter(p => Number(p.current_stock) <= Number(p.min_stock||0)); }
function stockValue(){ return STATE.products.reduce((s,p)=> s + Number(p.current_stock||0)*Number(p.unit_cost||0), 0); }
function suggestedQty(p){
  const target = Number(p.max_stock) || (Number(p.reorder_point) ? Number(p.reorder_point)*2 : Number(p.min_stock||0)*2);
  return Math.max(0, target - Number(p.current_stock||0));
}
function monthSpend(){ return STATE.monthInvoices.reduce((s,i)=> s + Number(i.total_amount||0), 0); }
function spendBySupplier(){
  const map = {};
  STATE.monthInvoices.forEach(i => {
    const name = i.suppliers ? i.suppliers.name : 'Sin proveedor';
    map[name] = (map[name]||0) + Number(i.total_amount||0);
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function productCard(p){
  const el = document.createElement('div');
  el.className = 'item-card';
  const low = Number(p.current_stock) <= Number(p.min_stock||0);
  const cat = catOf(p.category_id);
  el.innerHTML = `
    <div class="ico" style="${cat?`background:${cat.color_hex}22;color:${cat.color_hex}`:''}">${(p.name||'?')[0].toUpperCase()}</div>
    <div class="body">
      <div class="nm">${p.name}</div>
      <div class="meta">${cat?cat.name:'Sin categoría'}${p.sku?' · '+p.sku:''}</div>
    </div>
    <div class="right">
      <div class="stock ${low?'low':''}">${fmt(p.current_stock)} <span class="unit">${p.unit_of_measure||''}</span></div>
      <span class="badge ${low?'low':'ok'}">${low?'bajo':'ok'}</span>
    </div>`;
  el.onclick = () => openMovementModal(p);
  return el;
}
function movementCard(m){
  const el = document.createElement('div');
  el.className = 'item-card';
  const typeColor = {ENTRADA:'var(--ok)',SALIDA:'var(--ink-dim)',MERMA:'var(--danger)',AJUSTE:'var(--warn)'}[m.movement_type] || 'var(--ink-dim)';
  const sign = m.movement_type==='ENTRADA' ? '+' : (m.movement_type==='SALIDA'||m.movement_type==='MERMA' ? '−' : '±');
  el.innerHTML = `
    <div class="ico" style="color:${typeColor}">${sign}</div>
    <div class="body">
      <div class="nm">${m.products ? m.products.name : 'Producto'}</div>
      <div class="meta">${m.movement_type}${m.reference_type==='factura'?' · factura':''} · ${new Date(m.created_at).toLocaleDateString('es-CR')}${m.notes?' · '+m.notes:''}</div>
    </div>
    <div class="right"><div class="stock">${fmt(m.quantity)} <span class="unit">${(m.products&&m.products.unit_of_measure)||''}</span></div></div>`;
  return el;
}

function openProductModal(p){
  const isEdit = !!p;
  const catOptions = STATE.categories.map(c=>`<option value="${c.id}" ${p&&p.category_id===c.id?'selected':''}>${c.name}</option>`).join('');
  const supOptions = STATE.suppliers.filter(s=>s.is_active!==false).map(s=>`<option value="${s.id}" ${p&&p.preferred_supplier_id===s.id?'selected':''}>${s.name}</option>`).join('');
  showModal(`
    <h3>${isEdit?'Editar insumo':'Nuevo insumo'}</h3>
    <form id="product-form">
      <div class="field"><label>Nombre</label><input name="name" required value="${p?p.name:''}"></div>
      <div class="field"><label>Categoría</label><select name="category_id"><option value="">Sin categoría</option>${catOptions}</select></div>
      <div class="field"><label>Proveedor habitual</label><select name="preferred_supplier_id"><option value="">Sin definir</option>${supOptions}</select></div>
      <div class="field"><label>Unidad (kg, lt, unidad…)</label><input name="unit_of_measure" value="${p?p.unit_of_measure||'':'unidad'}" required></div>
      <div class="field"><label>Stock mínimo (dispara alerta)</label><input name="min_stock" type="number" step="any" value="${p?p.min_stock||0:0}"></div>
      <div class="field"><label>Stock ideal (a cuánto pedir para llegar) — opcional</label><input name="max_stock" type="number" step="any" value="${p&&p.max_stock?p.max_stock:''}"></div>
      <div class="field"><label>Costo unitario (₡, opcional)</label><input name="unit_cost" type="number" step="any" value="${p?p.unit_cost||'':''}"></div>
      ${!isEdit ? `<div class="field"><label>Stock inicial</label><input name="initial_stock" type="number" step="any" value="0"></div>` : ''}
      <button class="btn" type="submit">${isEdit?'Guardar cambios':'Crear insumo'}</button>
      ${isEdit ? `<button class="btn secondary" type="button" id="deactivate-btn" style="margin-top:8px;">Desactivar insumo</button>` : ''}
    </form>
  `);
  document.getElementById('product-form').onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const payload = {
      name: f.get('name'), category_id: f.get('category_id')||null,
      preferred_supplier_id: f.get('preferred_supplier_id')||null,
      unit_of_measure: f.get('unit_of_measure'), min_stock: Number(f.get('min_stock')||0),
      max_stock: f.get('max_stock')?Number(f.get('max_stock')):null,
      unit_cost: f.get('unit_cost')?Number(f.get('unit_cost')):null,
      restaurant_id: STATE.me.restaurant_id
    };
    try{
      if(isEdit){
        const {error} = await sb.from('products').update(payload).eq('id', p.id);
        if(error) throw error;
      } else {
        const {data, error} = await sb.from('products').insert(payload).select().single();
        if(error) throw error;
        const initial = Number(f.get('initial_stock')||0);
        if(initial > 0){
          await sb.rpc('register_inventory_movement', {
            p_product_id: data.id, p_movement_type:'ENTRADA', p_quantity: initial,
            p_unit_cost: payload.unit_cost, p_reference_type:'stock_inicial', p_reference_id:null,
            p_reference_date: new Date().toISOString().slice(0,10), p_notes:'Stock inicial', p_created_by: STATE.session.user.id
          });
        }
      }
      closeModal(); await refreshProducts(); render(); toast('Guardado');
    }catch(err){ toast(err.message||'Error', true); }
  };
  if(isEdit) document.getElementById('deactivate-btn').onclick = async () => {
    await sb.from('products').update({is_active:false}).eq('id', p.id);
    closeModal(); await refreshProducts(); render(); toast('Insumo desactivado');
  };
}

function openMovementModal(p){
  showModal(`
    <h3>${p.name}</h3>
    <div class="hint" style="margin-bottom:10px;">Stock actual: <b>${fmt(p.current_stock)} ${p.unit_of_measure||''}</b></div>

        p_product_id: p.id, p_movement_type: type, p_quantity: Number(f.get('quantity')),
        p_unit_cost: null, p_reference_type:'manual', p_reference_id:null,

/* ---------------- ORDERS (lista de pedido, reemplaza el Excel semanal) ---------------- */
function renderOrders(main){
  const groups = {};
  STATE.products.forEach(p => {
    const key = p.preferred_supplier_id || '__none';
    if(!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  const keys = Object.keys(groups).sort((a,b)=>{
    if(a==='__none') return 1; if(b==='__none') return -1;
    return (supOf(a)?.name||'').localeCompare(supOf(b)?.name||'');
  });
  main.innerHTML = `
    <div class="hint">Lista de pedido automática por proveedor — reemplaza la hoja de Excel. Se calcula sola con el stock actual y el stock ideal de cada insumo.</div>
    <div id="orders-list" style="display:flex;flex-direction:column;gap:12px;"></div>
  `;
  const list = document.getElementById('orders-list');
  if(!keys.length){ list.innerHTML = `<div class="empty">Agrega insumos y asígnales proveedor para ver la lista de pedido.</div>`; return; }
  let any = false;
  keys.forEach(key => {
    const sup = key==='__none' ? null : supOf(key);
    const items = groups[key].map(p=>({p, qty: suggestedQty(p)})).filter(x=>x.qty>0 || Number(x.p.current_stock)<=Number(x.p.min_stock||0));
    if(!items.length) return;
    any = true;
    const channel = sup ? (sup.order_channel||'whatsapp') : 'whatsapp';
    const orderText = `Pedido ${sup?sup.name:'(sin proveedor)'} — ${new Date().toLocaleDateString('es-CR')}\n` +
      items.map(({p,qty})=>`• ${p.name}: ${qty>0?fmt(qty):'?'} ${p.unit_of_measure||''}`).join('\n');
    const el = document.createElement('div');
    el.className = 'supplier-group';
    el.innerHTML = `
      <div class="head">
        <div><b>${sup ? sup.name : 'Sin proveedor asignado'}</b>${sup ? channelBadge(channel) : ''}</div>
      </div>
      ${items.map(({p,qty})=>`
        <div class="order-row">
          <span>${p.name} <span class="hint">(hay ${fmt(p.current_stock)} ${p.unit_of_measure||''})</span></span>
          <span class="oq">${qty>0?fmt(qty):'revisar'} ${p.unit_of_measure||''}</span>
        </div>`).join('')}
      <div class="order-actions"></div>
    `;
    const actions = el.querySelector('.order-actions');
    const addCopyBtn = (label, primary) => {
      const b = Object.assign(document.createElement('button'), {className: primary?'btn':'btn ghost', textContent: label});
      b.onclick = () => navigator.clipboard.writeText(orderText).then(()=>toast('Pedido copiado')).catch(()=>toast('No se pudo copiar', true));
      actions.appendChild(b);
      return b;
    };
    if(sup && channel==='whatsapp'){
      const waBtn = Object.assign(document.createElement('button'), {className:'btn', textContent:'Enviar por WhatsApp'});
      waBtn.onclick = () => {
        const text = encodeURIComponent(orderText);
        const phone = (sup.whatsapp_phone||'').replace(/\D/g,'');
        const url = phone ? `https://wa.me/${phone}?text=${text}` : `https://api.whatsapp.com/send?text=${text}`;
        window.open(url, '_blank');
      };
      actions.appendChild(waBtn);
      addCopyBtn('Copiar lista', false);
    } else if(sup && channel==='portal'){
      addCopyBtn('Copiar lista', true);
      if(sup.portal_url){
        const openBtn = Object.assign(document.createElement('button'), {className:'btn secondary', textContent:'Abrir portal ↗'});
        openBtn.onclick = () => window.open(sup.portal_url, '_blank');
        actions.appendChild(openBtn);
      }
    } else {
      addCopyBtn('Copiar lista', true);
    }
    list.appendChild(el);
  });
  if(!any) list.innerHTML = `<div class="empty">Nada por pedir todavía — todo el stock está bien</div>`;
}

function openRecipeModal(r){
  const isEdit = !!r;
  let rows = isEdit ? (r.recipe_items||[]).map(i=>({product_id:i.product_id, quantity:i.quantity, unit:i.unit})) : [{product_id:'',quantity:'',unit:''}];
  function renderIngredients(){
    const box = document.getElementById('ingredients-box');
    box.innerHTML = rows.map((row,idx)=>`
      <div class="ingredient-row">
        <select data-idx="${idx}" data-f="product_id">
          <option value="">Elegir insumo…</option>${STATE.products.map(p=>`<option value="${p.id}" ${row.product_id===p.id?'selected':''}>${p.name}</option>`).join('')}
        </select>
        <input data-idx="${idx}" data-f="quantity" type="number" step="any" placeholder="Cant." value="${row.quantity||''}">
        <button type="button" class="rm" data-rm="${idx}">✕</button>
      </div>`).join('');
    box.querySelectorAll('select,input').forEach(el => el.onchange = (e) => {
      rows[el.dataset.idx][el.dataset.f] = el.type==='number' ? Number(el.value) : el.value;
    });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { rows.splice(Number(b.dataset.rm),1); renderIngredients(); });
  }
  showModal(`
    <h3>${isEdit?'Editar receta':'Nueva receta'}</h3>
    <form id="recipe-form">
      <div class="field"><label>Nombre del plato</label><input name="name" required value="${r?r.name:''}"></div>
      <div class="section-title" style="margin-bottom:8px;">Ingredientes</div>
      <div id="ingredients-box"></div>
      <button type="button" class="btn ghost" id="add-ingredient">+ agregar ingrediente</button>
      <button class="btn" type="submit" style="margin-top:14px;">${isEdit?'Guardar receta':'Crear receta'}</button>
    </form>
  `);
  renderIngredients();
  document.getElementById('add-ingredient').onclick = () => { rows.push({product_id:'',quantity:'',unit:''}); renderIngredients(); };
  document.getElementById('recipe-form').onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const validRows = rows.filter(row => row.product_id && row.quantity > 0);
    if(!validRows.length){ toast('Agrega al menos un ingrediente con cantidad', true); return; }
    try{
      let recipeId = r ? r.id : null;
      if(isEdit){
        await sb.from('recipes').update({name: f.get('name')}).eq('id', r.id);
        await sb.from('recipe_items').delete().eq('recipe_id', r.id);
      } else {
        const {data, error} = await sb.from('recipes').insert({name: f.get('name'), restaurant_id: STATE.me.restaurant_id}).select().single();
        if(error) throw error;
        recipeId = data.id;
      }
      const inserts = validRows.map(row => ({recipe_id: recipeId, product_id: row.product_id, quantity: row.quantity}));
      const {error: e2} = await sb.from('recipe_items').insert(inserts);
      if(e2) throw e2;
      closeModal(); await refreshRecipes(); render(); toast('Receta guardada');
    }catch(err){ toast(err.message||'Error', true); }
  };
}

/* ---------------- SCAN INVOICE (automatización principal) ---------------- */
function openScanModal(){
  showModal(`
    <h3>Registrar factura</h3>
    <div class="card" style="margin-bottom:10px;">
      <div style="font-weight:800;font-size:14px;margin-bottom:4px;">Archivo XML (factura electrónica)</div>
      <div class="hint" style="margin-bottom:10px;">Si el proveedor te la manda por correo (la mayoría de facturas formales en Costa Rica vienen así), subí el .xml — es el dato exacto, sin IA de por medio y sin fallar por letra ilegible.</div>
      <input type="file" id="scan-xml" accept=".xml,text/xml" style="width:100%;">
    </div>
    <div class="card">
      <div style="font-weight:800;font-size:14px;margin-bottom:4px;">Foto de la factura</div>
      <div class="hint" style="margin-bottom:10px;">Para facturas físicas o de proveedores informales que no dan factura electrónica. La IA hace su mejor esfuerzo — revisa bien antes de confirmar.</div>
      <input type="file" id="scan-file" accept="image/*" capture="environment" style="width:100%;">
    </div>
    <div id="scan-status" style="margin-top:12px;"></div>
  `);
  document.getElementById('scan-file').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    await runScan(file);
  };
  document.getElementById('scan-xml').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const status = document.getElementById('scan-status');
    try{
      const text = await file.text();
      const data = parseInvoiceXML(text);
      renderScanReview(data, null, 'xml');
    }catch(err){

    }
  };
}

function parseInvoiceXML(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if(doc.querySelector('parsererror')) throw new Error('El archivo no es un XML válido.');
  const root = doc.documentElement;
  const q = (node, tag) => { if(!node) return null; const el = node.getElementsByTagNameNS('*', tag); return el.length ? el[0] : null; };
  const qAll = (node, tag) => node ? Array.from(node.getElementsByTagNameNS('*', tag)) : [];
  const text = (el) => el ? (el.textContent||'').trim() : '';
  const num = (el) => { const t = text(el); return t ? Number(t) : null; };

  const emisor = q(root, 'Emisor');
  const supplier_name = text(q(emisor, 'Nombre'));
  const invoice_number = text(q(root, 'NumeroConsecutivo')) || null;
  const fechaRaw = text(q(root, 'FechaEmision'));
  const invoice_date = fechaRaw ? fechaRaw.slice(0,10) : null;
  const resumen = q(root, 'ResumenFactura');
  const total_amount = num(q(resumen, 'TotalComprobante')) ?? num(q(resumen, 'TotalVenta'));

  const lineas = qAll(root, 'LineaDetalle');
  const items = lineas.map(li => ({
    name: text(q(li, 'Detalle')) || 'Producto',
    quantity: num(q(li, 'Cantidad')) || 1,
    unit: text(q(li, 'UnidadMedida')) || null,
    unit_price: num(q(li, 'PrecioUnitario'))
  }));

  if(!supplier_name && !items.length){
    throw new Error('No se reconoció el formato — ¿es el XML de una factura electrónica de Costa Rica?');
  }
  return { supplier_name: supplier_name || null, invoice_number, invoice_date, total_amount: total_amount ?? null, sale_type: null, items };
}

async function runScan(file){
  const status = document.getElementById('scan-status');
  status.innerHTML = `<div class="loading"><div class="spinner"></div>Subiendo foto…</div>`;
  try{
    const path = `kontea/${STATE.me.restaurant_id}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
    const {error: upErr} = await sb.storage.from('invoices').upload(path, file, {contentType: file.type || 'image/jpeg'});
    if(upErr) throw upErr;
    const {data: signed, error: signErr} = await sb.storage.from('invoices').createSignedUrl(path, 3600);
    if(signErr) throw signErr;
    status.innerHTML = `<div class="loading"><div class="spinner"></div>Leyendo factura con IA…</div>`;
    const resp = await fetch(SUPABASE_URL + '/functions/v1/kontea-scan-items', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ image_url: signed.signedUrl, jwt: STATE.session.access_token, known_catalog: buildKnownCatalog() })
    });
    const result = await resp.json();
    if(!result.ok) throw new Error(result.error === 'unauthorized' ? 'Sesión no válida, vuelve a entrar.' : (result.error || 'No se pudo leer la factura'));
    renderScanReview(result.data, signed.signedUrl, 'ai');
  }catch(err){
    status.innerHTML = `<div class="error-box">${err.message||'Error al procesar la factura'}</div>`;
  }
}

function renderScanReview(data, imageUrl, source){
  let items = (data.items||[]).map(i => ({name:i.name||'', quantity:i.quantity||1, unit:i.unit||'', unit_price:i.unit_price||'', line_total:i.line_total||null, uncertain:!!i.uncertain}));
  const uncertainCount = items.filter(i=>i.uncertain).length;
  const hintText = source==='xml'
    ? 'Leído directamente del archivo XML — datos exactos, sin IA. Revisa el tipo de pago (no viene en el archivo) y confirma.'
    : (uncertainCount
        ? `La IA leyó esto pero no está segura de ${uncertainCount} línea${uncertainCount>1?'s':''} (marcada${uncertainCount>1?'s':''} en naranja) — revisa esas antes de confirmar, el resto ya lo leyó con confianza.`
        : 'La IA leyó esto con confianza — de todas formas dale un vistazo antes de confirmar. Los insumos nuevos se crean solos.');
  function renderItems(){
    const box = document.getElementById('scan-items-box');
    box.innerHTML = items.map((it,idx)=>`
      <div class="item-row ${it.uncertain?'uncertain':''}">
        ${it.uncertain ? `<div class="uncertain-tag">⚠ revisa esta línea — la IA no está segura</div>` : ''}
        <div class="top-line">
          <input data-idx="${idx}" data-f="name" placeholder="Producto" value="${it.name}">
          <input data-idx="${idx}" data-f="quantity" type="number" step="any" placeholder="Cant." value="${it.quantity}" style="max-width:70px;">
        </div>
        <div class="bottom-line">
          <input data-idx="${idx}" data-f="unit" placeholder="Unidad" value="${it.unit}">
          <input data-idx="${idx}" data-f="unit_price" type="number" step="any" placeholder="₡ unitario" value="${it.unit_price}">
          <button type="button" class="rm" data-rm="${idx}">✕</button>
        </div>
        ${it.line_total ? `<div class="line-total-hint">La factura mostraba el total de esta línea en ₡${Number(it.line_total).toLocaleString('es-CR')}</div>` : ''}
      </div>`).join('');
    box.querySelectorAll('input').forEach(el => el.oninput = () => {
      const idx = el.dataset.idx;
      items[idx][el.dataset.f] = el.type==='number' ? Number(el.value) : el.value;
      if(items[idx].uncertain){
        items[idx].uncertain = false; // el usuario ya lo revisó/corrigió
        const row = el.closest('.item-row');
        if(row){ row.classList.remove('uncertain'); const tag = row.querySelector('.uncertain-tag'); if(tag) tag.remove(); }
      }
    });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { items.splice(Number(b.dataset.rm),1); renderItems(); });
  }
  showModal(`
    <h3>Revisar factura</h3>
    <div class="hint" style="margin-bottom:12px;">${hintText}</div>
    <form id="scan-review-form">
      <div class="field"><label>Proveedor</label><input name="supplier_name" value="${data.supplier_name||''}" required></div>
      <div style="display:flex;gap:8px;">
        <div class="field" style="flex:1;"><label>N° factura</label><input name="invoice_number" value="${data.invoice_number||''}"></div>
        <div class="field" style="flex:1;"><label>Fecha</label><input name="invoice_date" type="date" value="${data.invoice_date||''}"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <div class="field" style="flex:1;"><label>Total ₡</label><input name="total_amount" type="number" step="any" value="${data.total_amount||''}" required></div>
        <div class="field" style="flex:1;"><label>Tipo</label><select name="sale_type"><option value="CONTADO" ${data.sale_type!=='CREDITO'?'selected':''}>Contado</option><option value="CREDITO" ${data.sale_type==='CREDITO'?'selected':''}>Crédito</option></select></div>
      </div>
      <div class="section-title" style="margin:10px 0 8px;">Productos (${items.length})</div>
      <div id="scan-items-box"></div>
      <button type="button" class="btn ghost" id="scan-add-item">+ agregar producto</button>
      <button class="btn" type="submit" style="margin-top:14px;">Confirmar y actualizar stock</button>
    </form>
  `);
  renderItems();
  document.getElementById('scan-add-item').onclick = () => { items.push({name:'',quantity:1,unit:'',unit_price:''}); renderItems(); };
  document.getElementById('scan-review-form').onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Guardando…';
    const payload = {
      supplier_name: f.get('supplier_name'), invoice_number: f.get('invoice_number'),
      invoice_date: f.get('invoice_date'), total_amount: Number(f.get('total_amount')),
      sale_type: f.get('sale_type'), image_url: imageUrl,
      items: items.filter(i=>i.name && i.name.trim()).map(i=>({name:i.name, quantity:i.quantity, unit:i.unit, unit_price:i.unit_price}))
    };
    try{
      const {data: res, error} = await sb.rpc('kontea_save_invoice_with_stock', {
        p_restaurant_id: STATE.me.restaurant_id, p_created_by: STATE.session.user.id, p: payload
      });
      if(error) throw error;
      if(!res.ok) throw new Error(res.error);
      closeModal();
      await Promise.all([refreshProducts(), refreshMovements(), refreshMonthInvoices()]);
      render();
      const newP = (res.new_products||[]);
      toast(`Factura guardada · ${res.items_count} insumos actualizados${newP.length?` · nuevos: ${newP.join(', ')}`:''}`);
    }catch(err){
      toast(err.message||'Error al guardar', true);
      btn.disabled = false; btn.textContent = 'Confirmar y actualizar stock';
    }
  };
}

  showModal(`<h3>Facturas sin insumos</h3><div class="hint" style="margin-bottom:12px;">Estas facturas ya están registradas (la mayoría vienen de Ticksy) pero todavía no tienen el detalle de insumos, así que no movieron el stock.</div><div id="pending-list" style="display:flex;flex-direction:column;gap:8px;"></div>`);
  const list = document.getElementById('pending-list');
  if(!STATE.pendingInvoices.length){ list.innerHTML = `<div class="empty">Sin pendientes</div>`; return; }
  STATE.pendingInvoices.forEach(inv => {
    const el = document.createElement('div');
    el.className = 'item-card';
    el.style.cursor = 'pointer';
    el.innerHTML = `
      <div class="ico">${(inv.suppliers?inv.suppliers.name:'?')[0].toUpperCase()}</div>
      <div class="body">

function openCompleteInvoiceModal(inv){
  let items = [];
  const supplierName = inv.suppliers ? inv.suppliers.name : 'Sin proveedor';
  function renderItems(){
    const box = document.getElementById('complete-items-box');
    if(!box) return;
    box.innerHTML = items.map((it,idx)=>`
      <div class="item-row ${it.uncertain?'uncertain':''}">
        ${it.uncertain ? `<div class="uncertain-tag">⚠ revisa esta línea — la IA no está segura</div>` : ''}
        <div class="top-line">
          <input data-idx="${idx}" data-f="name" placeholder="Producto" value="${it.name}">
          <input data-idx="${idx}" data-f="quantity" type="number" step="any" placeholder="Cant." value="${it.quantity}" style="max-width:70px;">
        </div>
        <div class="bottom-line">
          <input data-idx="${idx}" data-f="unit" placeholder="Unidad" value="${it.unit}">
          <input data-idx="${idx}" data-f="unit_price" type="number" step="any" placeholder="₡ unitario" value="${it.unit_price}">
          <button type="button" class="rm" data-rm="${idx}">✕</button>
        </div>
        ${it.line_total ? `<div class="line-total-hint">La factura mostraba el total de esta línea en ₡${Number(it.line_total).toLocaleString('es-CR')}</div>` : ''}
      </div>`).join('');
    box.querySelectorAll('input').forEach(el => el.oninput = () => {
      const idx = el.dataset.idx;
      items[idx][el.dataset.f] = el.type==='number' ? Number(el.value) : el.value;
      if(items[idx].uncertain){
        items[idx].uncertain = false;
        const row = el.closest('.item-row');
        if(row){ row.classList.remove('uncertain'); const tag = row.querySelector('.uncertain-tag'); if(tag) tag.remove(); }
      }
    });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { items.splice(Number(b.dataset.rm),1); renderItems(); });
  }
  showModal(`
    <h3>Completar factura</h3>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-weight:800;font-size:14px;">${supplierName}</div>
      <div class="hint" style="margin:2px 0 0;">${new Date(inv.invoice_date+'T00:00:00').toLocaleDateString('es-CR')}${inv.invoice_number?' · '+inv.invoice_number:''} · ${money(inv.total_amount)}</div>
    </div>
    ${inv.image_path ? `<button type="button" class="btn ghost" id="complete-scan-btn" style="margin-bottom:12px;">Leer insumos de la foto con IA</button><div id="complete-scan-status"></div>` : `<div class="hint" style="margin-bottom:12px;">Esta factura no tiene foto guardada — agrega los insumos a mano.</div>`}
    <div class="section-title" style="margin-bottom:8px;"><span>Productos (<span id="complete-items-count">0</span>)</span></div>
    <div id="complete-items-box"></div>
    <button type="button" class="btn ghost" id="complete-add-item">+ agregar producto</button>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button type="button" class="btn secondary" id="complete-dismiss-btn" style="flex:1;">No es de inventario</button>
      <button type="button" class="btn" id="complete-save-btn" style="flex:1;">Registrar stock</button>
    </div>
  `);
  renderItems();
  document.getElementById('complete-add-item').onclick = () => { items.push({name:'',quantity:1,unit:'',unit_price:''}); renderItems(); refreshCount(); };
  function refreshCount(){ const c=document.getElementById('complete-items-count'); if(c) c.textContent = items.length; }
  if(inv.image_path){
    document.getElementById('complete-scan-btn').onclick = async () => {
      const status = document.getElementById('complete-scan-status');
      status.innerHTML = `<div class="loading"><div class="spinner"></div>Leyendo factura con IA…</div>`;
      try{
        const {data: signed, error: signErr} = await sb.storage.from('invoices').createSignedUrl(inv.image_path, 3600);
        if(signErr) throw signErr;
        const resp = await fetch(SUPABASE_URL + '/functions/v1/kontea-scan-items', {
          method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({ image_url: signed.signedUrl, jwt: STATE.session.access_token, known_catalog: buildKnownCatalog(inv.supplier_id) })
        });
        const result = await resp.json();
        if(!result.ok) throw new Error(result.error === 'unauthorized' ? 'Sesión no válida, vuelve a entrar.' : (result.error || 'No se pudo leer la factura'));
        items = (result.data.items||[]).map(i => ({name:i.name||'', quantity:i.quantity||1, unit:i.unit||'', unit_price:i.unit_price||'', line_total:i.line_total||null, uncertain:!!i.uncertain}));
        status.innerHTML = '';
        renderItems(); refreshCount();
      }catch(err){
        status.innerHTML = `<div class="error-box">${err.message||'Error al leer la factura'}</div>`;
      }
    };
  }
  document.getElementById('complete-dismiss-btn').onclick = async () => {
    const btn = document.getElementById('complete-dismiss-btn');
    btn.disabled = true;
    try{
      const {error} = await sb.from('kontea_invoice_dismissals').insert({
        invoice_id: inv.id, restaurant_id: STATE.me.restaurant_id, dismissed_by: STATE.session.user.id
      });
      if(error) throw error;
      closeModal();
      await refreshPendingInvoices();
      render();
      toast('Factura descartada de inventario');
    }catch(err){
      toast(err.message||'Error al descartar', true);
      btn.disabled = false;
    }
  };
  document.getElementById('complete-save-btn').onclick = async () => {
    const validItems = items.filter(i=>i.name && i.name.trim()).map(i=>({name:i.name, quantity:i.quantity, unit:i.unit, unit_price:i.unit_price}));
    if(!validItems.length){ toast('Agrega al menos un insumo', true); return; }
    const btn = document.getElementById('complete-save-btn');
    btn.disabled = true; btn.textContent = 'Guardando…';
    try{
      const {data: res, error} = await sb.rpc('kontea_complete_invoice_with_stock', {
        p_restaurant_id: STATE.me.restaurant_id, p_invoice_id: inv.id, p_created_by: STATE.session.user.id,
        p: {items: validItems}
      });
      if(error) throw error;
      if(!res.ok) throw new Error(res.error === 'factura_ya_tiene_insumos' ? 'Esta factura ya se completó (quizás en otra pestaña).' : res.error);
      closeModal();
      await Promise.all([refreshProducts(), refreshMovements(), refreshPendingInvoices()]);
      render();
      const newP = (res.new_products||[]);
      toast(`Stock actualizado · ${res.items_count} insumos${newP.length?` · nuevos: ${newP.join(', ')}`:''}`);
    }catch(err){
      toast(err.message||'Error al guardar', true);
      btn.disabled = false; btn.textContent = 'Registrar stock';
    }
  };
}
